<title>Page not found | Felipe Tommaselli</title>
<link rel="stylesheet" href="/stylesheet.css">
<script>
  // The Mind the Phase project page moved from /MindThePhase/ to /mindthephase/.
  // Forward any old path (pages, figures, media) that has no explicit redirect page.
  (function () {
    var oldPrefix = "/MindThePhase/";
    var path = location.pathname === "/MindThePhase" ? oldPrefix : location.pathname;
    if (path.indexOf(oldPrefix) === 0) {
      location.replace("/mindthephase/" + path.slice(oldPrefix.length) + location.search + location.hash);
    }
  })();
</script>
